# Floci GCP emulator (floci-gcp) with an example app service.
# Copy what you need into the project's Compose file; see references/docker.md for what to trim.
# Docs: https://floci.io/floci-gcp/configuration/docker-compose/

services:
  floci-gcp:
    image: floci/floci-gcp:latest
    # The CLI's default container name, so `floci gcp status|wait|env|logs` work unchanged.
    # Rename it (and pass --container) when two projects run on the same host. The namespace
    # and the network name below are per project too: change all three together, or two
    # projects copied from this file will touch each other's containers.
    container_name: floci-gcp
    ports:
      # Loopback only: the emulator accepts fake credentials, so do not publish it to the
      # network. Other Compose services reach it by service name, not through this port.
      - "127.0.0.1:4588:4588"
    environment:
      # Other containers reach the emulator by this name, so returned URLs must use it.
      # Remove both lines when only the host talks to the emulator.
      FLOCI_GCP_HOSTNAME: floci-gcp
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      # Keeps the containers this emulator launches (Cloud Run, Cloud SQL, GKE, Kafka) apart
      # from those of other emulator instances on the same Docker host.
      FLOCI_GCP_DOCKER_RESOURCE_NAMESPACE: myapp
      # Lets the app reach those child containers by name.
      FLOCI_GCP_SERVICES_DOCKER_NETWORK: myapp-net
      # Keep state in the volume below. Remove both to start empty every time.
      FLOCI_GCP_STORAGE_MODE: persistent
    volumes:
      # Needed by services that run real containers (Cloud Run, Cloud SQL, GKE, Managed Kafka).
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-gcp-data:/app/data
    # No healthcheck here: the image has one built in.

  app:
    build: .
    environment:
      # Client libraries skip credentials when these are set. Storage needs the scheme.
      STORAGE_EMULATOR_HOST: http://floci-gcp:4588
      PUBSUB_EMULATOR_HOST: floci-gcp:4588
      FIRESTORE_EMULATOR_HOST: floci-gcp:4588
      DATASTORE_EMULATOR_HOST: floci-gcp:4588
      SECRET_MANAGER_EMULATOR_HOST: floci-gcp:4588
      GOOGLE_CLOUD_PROJECT: floci-local
    depends_on:
      floci-gcp:
        condition: service_healthy

volumes:
  floci-gcp-data:

networks:
  default:
    name: myapp-net
