# Floci OCI emulator (floci-oci) with an example app service.
# Copy what you need into the project's Compose file; see references/docker.md for what to trim.
# Docs: https://floci.io/floci-oci/getting-started/quick-start/

services:
  floci-oci:
    image: floci/floci-oci:latest
    # The CLI's default container name, so `floci oci status|wait|env|logs` work unchanged.
    # Rename it (and pass --container) when two projects run on the same host.
    container_name: floci-oci
    ports:
      - "4599:4599"
    environment:
      # Other containers reach the emulator by this name, so returned URLs must use it.
      # Remove when only the host talks to the emulator.
      FLOCI_OCI_HOSTNAME: floci-oci
      # Keeps the containers this emulator launches (Functions, OKE) apart from those of
      # other emulator instances on the same Docker host.
      FLOCI_OCI_DOCKER_RESOURCE_NAMESPACE: myapp
      # Lets the app reach those child containers by name.
      FLOCI_OCI_SERVICES_DOCKER_NETWORK: myapp-net
      # Keep state in the volume below. Remove both to start empty every time.
      FLOCI_OCI_STORAGE_MODE: persistent
    volumes:
      # Needed by Functions and OKE, which run real containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-oci-data:/app/data
    # No healthcheck here: the image has one built in.

  app:
    build: .
    environment:
      # One endpoint for every OCI service. The app's own code reads this variable and sets
      # it on each SDK client; the SDK also needs a config file and a signing key (any key
      # works), see https://floci.io/floci-oci/getting-started/oci-setup/
      OCI_ENDPOINT: http://floci-oci:4599
    depends_on:
      floci-oci:
        condition: service_healthy

volumes:
  floci-oci-data:

networks:
  default:
    name: myapp-net
