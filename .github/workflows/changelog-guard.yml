name: Changelog Guard

# CHANGELOG.md is generated by semantic-release (the Release Cut workflow) —
# a feat, fix or perf subject becomes the release note verbatim, so PRs
# must not edit the file by hand. Genuine corrections (typos in history,
# security notes) are allowed by adding the `changelog-edit` label to the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'CHANGELOG.md'

permissions: {}

jobs:
  guard:
    name: CHANGELOG.md is generated
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-edit') }}
    steps:
      - name: Reject hand edits
        run: |
          echo "::error::CHANGELOG.md is generated by semantic-release — a feat, fix or perf subject becomes the release note, so hand edits conflict with the release commit. Remove the CHANGELOG.md changes from this PR, or ask a maintainer for the 'changelog-edit' label if this is a genuine correction."
          exit 1
